# Render Blueprint for LH Studio (https://render.com/docs/blueprint-spec)
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.

services:
  - type: web
    name: lh-studio-api
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    # Single instance: the in-memory rate-limit store is per process.
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # e.g. https://lh-studio-web.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none # use "lax" once frontend and API share a custom domain
      - key: TRUST_PROXY
        value: "1"
      - key: BOOTSTRAP_TOKEN
        sync: false # set for the first owner registration, then delete

  - type: web
    name: lh-studio-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://lh-studio-api.onrender.com
    routes:
      # SPA fallback for React Router.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
